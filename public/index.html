<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dvonne Daniels | DevOps Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0b1120;
            color: #e2e8f0;
            overflow-x: hidden;
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 3.2rem;
            color: #38bdf8;
            margin-bottom: 14px;
            font-weight: 700;
        }

        h2 {
            font-size: 1.1rem;
            font-weight: 400;
            color: #94a3b8;
            margin-bottom: 40px;
        }

        p {
            max-width: 760px;
            line-height: 1.8;
            color: #cbd5e1;
            margin-bottom: 18px;
        }

        code {
            background: rgba(255,255,255,0.08);
            padding: 3px 8px;
            border-radius: 6px;
            color: #38bdf8;
        }

        .links {
            margin-top: 30px;
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .button {
            text-decoration: none;
            background: #38bdf8;
            color: #0f172a;
            padding: 14px 28px;
            border-radius: 10px;
            font-weight: 600;
            transition: 0.2s ease;
            box-shadow: 0 0 18px rgba(56,189,248,0.25);
        }

        .button:hover {
            transform: translateY(-2px);
            background: #7dd3fc;
        }

        footer {
            margin-top: 80px;
            color: #64748b;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.4rem;
            }

            h2 {
                font-size: 1rem;
            }

            p {
                font-size: 0.95rem;
            }

            .button {
                width: 100%;
                max-width: 260px;
            }

            .links {
                width: 100%;
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Dvonne Daniels</h1>

        <h2>
            Linux • DevOps • Automation • Infrastructure
        </h2>

        <p>
            Building home lab infrastructure, CI/CD pipelines,
            containerized services, automation platforms,
            and cloud-hosted Linux environments.
        </p>

        <div class="links">
            <a class="button"
               href="https://github.com/dvonnedaniels"
               target="_blank">
               GitHub
            </a>
        </div>

        <footer>
            Powered by Linux, Docker, and caffeine.
        </footer>

    </div>

</body>
</html>
