<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Servers</title>

  <style>
    body {
      background: #0b1120;
      color: white;
      font-family: Arial;
      padding: 40px;
    }

    .server-card {
      background: #111827;
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    h1 {
      color: #38bdf8;
    }

    .status {
      color: #22c55e;
    }
  </style>
</head>

<body>

  <h1>Server Inventory</h1>

  <div class="server-card">
    <h2>atlas.dvonneslab.com</h2>
    <p>Status: <span class="status">Online</span></p>
    <p>CPU: 24%</p>
    <p>RAM: 8GB / 32GB</p>
  </div>

  <div class="server-card">
    <h2>nova.dvonneslab.com</h2>
    <p>Status: <span class="status">Online</span></p>
    <p>CPU: 11%</p>
    <p>RAM: 4GB / 16GB</p>
  </div>

  <div class="server-card">
    <h2>orion.dvonneslab.com</h2>
    <p>Status: <span class="status">Online</span></p>
    <p>GPU Utilization: 82%</p>
    <p>VRAM: 18GB / 24GB</p>
  </div>

</body>
</html>
