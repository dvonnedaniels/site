<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SS</title>

  <style>
    body {
      background: #0b1120;
      color: white;
      font-family: Arial;
      padding: 40px;
    }

    .bartender-card {
      background: #111827;
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 20px;
      border: 1px solid #1e293b;
    }

    h1 {
      color: #38bdf8;
    }

    .status {
      color: #22c55e;
    }

    .tag {
      color: #94a3b8;
    }
  </style>
</head>

<body>

  <h1>SS Bartender Board</h1>

  <div class="bartender-card">
    <h2>Jenn</h2>
    <p>Status: <span class="status">Working Tonight</span></p>
    <p>Specialty: Old Fashioneds</p>
    <p class="tag">Twin Peaks</p>
  </div>

  <div class="bartender-card">
    <h2>Alyssa</h2>
    <p>Status: <span class="status">Available</span></p>
    <p>Specialty: Margaritas</p>
    <p class="tag">Sports Bar</p>
  </div>

  <div class="bartender-card">
    <h2>Annilou</h2>
    <p>Status: <span class="status">Weekend Shift</span></p>
    <p>Specialty: Espresso Martinis</p>
    <p class="tag">Downtown Lounge</p>
  </div>

</body>
</html>
